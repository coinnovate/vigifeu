# Vigifeu — configuration versionnée (plan de dev §1.1, Spec 02 P4)
# Tout paramètre qui décide quelque chose vit ici, jamais en dur dans le code.
# Le hash de ce fichier entrera dans qualification_reason (Lot 2).

[general]
db_path = "data/vigifeu.db"
# Zone d'interrogation FIRMS : France métropolitaine + marge (ouest,sud,est,nord)
firms_bbox = "-5.5,41.0,10.0,51.5"

[overpass]
# Spec 02 §3 (étape 2) : un passage regroupe les hotspots d'un même satellite
# dont les acquisitions tombent dans une même fenêtre. Un passage VIIRS au-dessus
# de la France dure ~2-3 min (granules adjacents) ; les passages sont espacés de
# ~100 min (période orbitale). 30 min regroupe un passage sans jamais fusionner
# deux passages successifs.
window_min = 30

[clustering]
# Spec 02 §4.2 — rattachement incrémental par passage. Ces valeurs décident de
# la fusion/scission des événements (first_acq_at est contractuel) : leur hash
# entre dans les versions de FireEvent (P4).
d_link_m = 1500              # rayon de rattachement (~4 pixels VIIRS)
d_link_grands_feux_m = 2500  # au-delà de n_hs_grand hotspots (sautes de feu)
n_hs_grand = 100             # seuil « grand feu »
t_gap_h = 48                 # 2 j sans détection ⇒ candidat perdu, nouvel événement
# Spec 02 §4.5 — transitions de cycle de vie
t_silence_h = 24             # actif → plus_detecte (2 groupes de passages VIIRS manqués)
t_reprise_days = 7           # plus_detecte → archive ; fenêtre de reprise (§4.3)

[fixed_source]
# Spec 02 §3 (étape 3) et §5.1 (R1) — registre des sources fixes (torchères,
# aciéries…). Un hotspot dans le rayon d'une source CONFIRMÉE est marqué et exclu
# du clustering. La promotion suspect_source_fixe → candidat se fait après
# n_promotion_days jours distincts (qualification.n_promotion_days), revue au CLI.
mark_radius_m = 1000        # rayon de marquage autour d'une source confirmée
candidate_min_radius_m = 500  # rayon plancher d'un candidat (emprise/2 sinon)

[qualification]
# Spec 02 §5.1 — règles des trois signatures, ordre d'évaluation strict. Le hash
# de cette section entre dans qualification_reason (explicabilité, P4).
# R1 — source fixe (persistant-fixe)
jours_distincts_fixe = 3
e_fixe_m = 1200              # emprise max d'une source fixe (torchères multi-points)
f_fixe_mw = 8               # FRP unitaire médian max
n_promotion_days = 15        # suspect_source_fixe stable ⇒ candidat fixed_source
# R3 — végétation (persistant-mobile)
e_mobile_m = 400             # extension spatiale min entre passages
f_mobile_mw = 20             # FRP max min sur la voie « mouvement » (calage : filtre le
                             # scatter nocturne diffus, ~2 MW/pixel, sans toucher les vrais
                             # feux ; à revoir avec la fixture France + vérité terrain, §5.3)
n_franc = 8                 # feu franc dès le 1er passage (publiable sans mouvement)

[relations]
# Spec 02 §7 — relations feu ↔ commune (étape 8 du cycle). Calculées sur l'UNION
# DES CELLULES du feu (fire_cell_state, grille cells.grid_m), PAS le hull convexe :
# le hull d'un méga-feu est convexe et ponte les zones non brûlées (le bassin
# d'Arcachon pour Saumos), surestimant l'emprise (Andernos ressortirait « sur l'eau »).
# L'union des cellules épouse la forme réelle. Le hull reste la géométrie d'affichage
# et la base de area_ha_estimee. Décision de cadrage Lot 3 (dévie du texte des specs).
paliers_km = [5, 10, 20]     # a_moins_de_5km / 10km / 20km (distance union cellules → limite communale)
emprise_min_ha = 1.0         # intersection minimale pour retenir emprise_dans_commune (filtre les slivers numériques)
# direction_vent (§7) — fait composé (géométrie + vent), recalculé à chaque weather_obs.
a_vent_deg = 30              # demi-angle du secteur autour de la direction VERS LAQUELLE le vent souffle
d_vent_km = 15               # portée du secteur
n_hysteresis = 3             # fermeture après N mesures consécutives hors secteur (anti-clignotement)

[poi]
# Spec 06 §2.2 — import OSM du référentiel POI (enjeux). Catégories v1 (Spec 05 §7).
# Chaque règle : une catégorie + un jeu de tags OSM à matcher (TOUS présents). Règles
# évaluées dans l'ordre, première qui matche. ⚠️ « Overpass » ici = l'API OpenStreetMap,
# rien à voir avec engine/overpass.py (passages satellites). Licence ODbL → attribution.
osm_rules = [
    { category = "camping",         match = { tourism = "camp_site" } },
    { category = "ecole",           match = { amenity = "school" } },
    { category = "hopital",         match = { amenity = "hospital" } },
    { category = "ehpad",           match = { amenity = "social_facility", social_facility = "nursing_home" } },
    { category = "station_service", match = { amenity = "fuel" } },
]
# Spec 06 §2.2 / §8 — import BD TOPO (IGN, thème « Services et activités », data.geopf.fr).
# 2ᵉ source : catégories officielles/fraîches (Etalab). Valeurs `nature` VÉRIFIÉES live
# (2026-08-01) contre la couche RÉELLE `zone_d_activite_ou_d_interet` (BD TOPO V3, WFS
# Géoplateforme) — PAS de couches séparées santé/enseignement en V3 : une seule couche PAI
# catégorisée par `nature`. Match insensible casse/accents. station_service ABSENT de BD TOPO
# (reste couvert par OSM seul). La dédup vs OSM se fait ensuite (source_priority + passe dédup).
bdtopo_rules = [
    { category = "camping", match = { nature = "Camping" } },
    { category = "hopital", match = { nature = "Hôpital" } },
    { category = "hopital", match = { nature = "Etablissement hospitalier" } },
    { category = "ehpad",   match = { nature = "Maison de retraite" } },
    { category = "ecole",   match = { nature = "Enseignement primaire" } },
    { category = "ecole",   match = { nature = "Collège" } },
    { category = "ecole",   match = { nature = "Lycée" } },
    { category = "ecole",   match = { nature = "Autre établissement d'enseignement" } },
]
# Spec 06 §2.3 — déduplication inter-sources. Deux POI de sources DIFFÉRENTES, même catégorie,
# à moins du rayon l'un de l'autre = même enjeu physique → un seul compte. On garde le POI de la
# source la PLUS prioritaire (fraîcheur/qualité), l'autre est marqué superseded_by. BD TOPO
# (officiel, frais) prime sur OSM ; Géorisques est seul sur icpe_seveso.
# Rayon PAR CATÉGORIE (défaut + surcharges) — calé sur la vraie donnée (2026-08-01) : les campings
# ont une grande emprise → centroïde de zone BD TOPO vs point OSM éloignés (« la Grigne » à 210 m),
# d'où 250 m ; les écoles/hôpitaux sont ponctuels (twins à ~8 m) → 150 m suffit, agrandir ne ferait
# qu'augmenter le risque de fusionner deux établissements voisins distincts. ⚠️ dédup par distance
# seule = approximation (résolution d'entités) ; un appariement par similarité de NOM affinerait
# (amélioration ultérieure). Erreur résiduelle faible et bornée par catégorie.
dedup_radius_m = { default = 150, camping = 250 }
source_priority = ["bdtopo", "georisques", "osm"]
# Spec 06 §2.2 / §8 — import Géorisques (3ᵉ source). Périmètre v1 : Seveso SEUL (seuil haut/bas)
# — sous-ensemble à fort enjeu, bien géolocalisé (les ICPE simples, géoloc grossière, en v1.1).
# Catégorie unique produite : icpe_seveso. Valeurs `statutSeveso` VÉRIFIÉES live (2026-08-01) contre
# l'API Géorisques : « Seveso seuil haut » / « Seveso seuil bas » (match sous-chaîne, insensible casse).
georisques_seveso_statuts = ["seveso seuil haut", "seveso seuil bas"]

[version]
# Spec 02 §6 — mesures factuelles par version. area_ha = aire de l'enveloppe ×
# facteur de remplissage (un feu ne brûle pas tout son enveloppe convexe) ;
# catégorie `estimee`, toujours affichée comme estimation.
area_fill_factor = 0.6

[cells]
# Spec 01 §4.3 / Spec 02 §7 — grille de cellules d'un feu (~750 m), état COURANT
# en v1 (plan §1.2). L'état d'une cellule se lit par rapport à la dernière activité
# du feu : front (dernières heures), récent (dernier jour), plus détecté au-delà.
grid_m = 750
t_front_h = 3            # cellule vue dans le dernier groupe de passages ⇒ front_actif
t_recent_h = 24         # vue dans les dernières 24 h ⇒ recent ; au-delà ⇒ plus_detecte

[dedup]
# Spec 02 §6 — déduplication inter-satellites PAR PASSAGE : deux satellites voient
# le même point physique à quelques minutes d'écart. Sans cette règle, l'ajout de
# NOAA-21 gonflerait mécaniquement les comptages et dégraderait la qualification.
window_min = 20              # fenêtres de passage qui se chevauchent à < 20 min
radius_m = 375               # pixels à < 375 m (résolution VIIRS)

[context]
# Spec 02 §2 — drought/vigieau ne sont tirés (un appel HTTP par commune) que pour
# les communes RÉELLEMENT EXPOSÉES à un feu actif : emprise + proximité immédiate.
# Les couronnes lointaines (jusqu'à 20 km) relèveront du balayage France quotidien
# du générateur (Lot 4), pas d'une rafale d'appels par feu. Mesuré en prod : à 5 km,
# 107 communes vs 714 sur toutes les couronnes. Une commune en emprise (distance NULL)
# est toujours incluse.
max_km = 5

[vigieau]
# Format VÉRIFIÉ LIVE le 28/07/2026 (dépôt MTES-MCT/vigieau-api + réponses réelles) :
# endpoint /api/zones?commune=&profil= → liste de zones {niveauGravite, arrete:{id,
# dateDebutValidite, dateFinValidite}}. niveauGravite observé : vigilance/alerte
# (barème _SEVERITE conforme). Fetcher ARMÉ.
activated = true
# API publique VigiEau (restrictions d'eau, catégorie declaree — Spec 01 §3.6).
# HYPOTHÈSE DE FORMAT (à vérifier contre l'API réelle) : GET {base_url}/zones
# ?commune={code_insee}&profil=particulier renvoie une liste de zones portant
# `niveauGravite` (vigilance/alerte/alerte_renforcee/crise) et un bloc `arrete`.
base_url = "https://api.vigieau.beta.gouv.fr/api"
profil = "particulier"
timeout_s = 30
max_retries = 3
retry_wait_min_s = 5
retry_wait_max_s = 60
provider = "vigieau"

[drought]
# Activation par source (cadrage Lot 3). Master `activated` + sous-flags par source :
# une source non vérifiée reste off pour ne pas ralentir le cycle (retries).
activated = true
meteo_forets_activated = true   # Météo des forêts : API DPMeteoForets v1 vérifiée live (clé apikey)
effis_activated = false         # EFFIS : en réalité un WMS, à recâbler (Lot 3) — laissé off
# EFFIS (FWI + sous-indices, point de grille) et Météo des forêts (danger départemental,
# niveau officiel 1..4). Catégories mesuree/estimee — Spec 01 §3.5.
effis_url = "https://ies-ows.jrc.ec.europa.eu/effis/fwi"       # à confirmer (WMS)
# Météo des forêts (DonnéesPubliques DPMeteoForets v1) : clé API en en-tête `apikey`, lue
# dans l'environnement (VIGIFEU_METEOFRANCE_KEY), jamais ici. Débit Unlimited.
meteo_forets_url = "https://public-api.meteofrance.fr/public/DPMeteoForets/v1/carte/departement/encours"
meteo_forets_echeance = "J1"    # danger prévu J+1 (le produit est J+1/J+2, pas J0)
timeout_s = 30
max_retries = 3
retry_wait_min_s = 5
retry_wait_max_s = 60
provider_effis = "effis"
provider_meteo_forets = "meteo-france"

[generate]
# Générateur statique (Spec 04). Le site est un dossier de HTML servi par Nginx/CDN.
# « Vigifeu » est le codename R&D interne (package, CLI) ; « Sentifeu » est la MARQUE
# PUBLIQUE affichée sur le site (titres, JSON-LD, pied de page).
marque = "Sentifeu"
site_dir = "data/site"                 # racine de sortie (arborescence /feux, /communes…)
templates_dir = "templates"            # gabarits Jinja2 (repo)
static_dir = "static"                  # css, js minimal, pmtiles (copiés tels quels)
base_url = "https://sentifeu.fr"       # origine publique pour canonical/sitemaps
referentiel_millesime = "2026"         # millésime Admin Express affiché en attribution (Spec 03 §2.7)
# Fond de carte MapTiler (raster) — lu par write_carte_config → window.SENTIFEU_MAPTILER_MAP.
# « outdoor-v2 » : forêts en vert explicite + relief (on doit VOIR la végétation sur un site de
# feux de forêt) ; fond assez clair pour que les cellules du feu et les POI restent lisibles
# par-dessus (le « dataviz » gris d'avant était trop effacé). Sert la carte nationale ET les fiches.
maptiler_map = "outdoor-v2"
# Étiquette « nouveau » sur la liste d'accueil : feu dont la PREMIÈRE détection remonte à moins
# de ce nombre d'heures, mesuré depuis la dernière observation en base (pas l'heure de génération,
# P0 : pas d'horodatage de build). Factuel, pas une alerte.
nouveau_max_h = 24
# Indexation par vagues (Spec 04 §5) : une commune a une page (et entre au sitemap) si elle
# est concernée par un feu OU a >= ce nombre de feux BDIFF recensés. Abaisser pour élargir
# la vague (puis `vigifeu rebuild`), quand Search Console montre une indexation saine.
wave_min_history_fires = 3
# Méthodologie chiffrée : plafond (heures) pour la mesure de latence NRT. Au-delà, la
# détection est considérée re-téléchargée (backfill/récupération) et exclue — son ingested_at
# tardif fausserait la médiane (la latence NRT ne se rejoue pas, P5).
latence_nrt_max_h = 6
# Chronologie des passages (fiche feu) : un feu long compte des dizaines de passages. Au-delà
# de `chrono_repli_seuil` lignes, on garde les `chrono_repli_visible` passages les plus récents
# visibles et on replie les plus anciens dans un <details> (même parti que les communes lointaines) —
# la liste complète reste dans le HTML (crawlable) mais la page redevient scannable. Le pic
# d'intensité, lui, est déjà porté par la synthèse, donc rien d'important n'est masqué.
chrono_repli_seuil = 20
chrono_repli_visible = 12
# Timeline des bulletins de veille presse (Spec 09 §5) : au-delà de `bulletins_repli_seuil`
# entrées, on garde les `bulletins_repli_visible` plus récentes visibles et on replie les plus
# anciennes dans un <details> (même parti que la chronologie). Un feu produit ~1 bulletin/jour.
bulletins_repli_seuil = 8
bulletins_repli_visible = 6

# PWA « installable safe » (cadrage PWA). Présence de cette section = le site émet le
# manifest, le service worker et les balises (lien manifest, theme-color) sur toutes les
# pages. La retirer suffit à revenir à un statique nginx ordinaire (le SW se désinstalle
# de lui-même à la prochaine visite, faute de /sw.js — voir deploy/nginx-sentifeu.conf).
# Le service worker ne met JAMAIS en cache les fiches de feux ni les GeoJSON : seule la
# présentation (CSS/JS/icônes) est précachée — la fraîcheur des détections prime (P0).
[pwa]
name = "Sentifeu — veille des feux de végétation"
short_name = "Sentifeu"
description = "Veille satellitaire des incendies de végétation en France : feux détectés, cartes et fiches datées et sourcées."
theme_color = "#1b2a4a"        # marine du bandeau (cohérent avec --marine du CSS)
background_color = "#ffffff"   # fond de l'écran de démarrage (papier)

[imagerie]
# Spec 06 §5 — cran 2 : calque Sentinel-2 10 m (fausse-couleur SWIR « brûlure ») via CDSE
# Sentinel Hub WMS, daté sur la fenêtre du feu (mostRecent peu nuageux). 25× plus fin que le
# GIBS quotidien 250 m d'avant : la cicatrice ressort. Discipline P0 : image = OBSERVATION
# DATÉE, jamais un état courant (légende « l'étendue a pu évoluer »). L'ID d'instance est
# SEMI-PUBLIC (comme la clé MapTiler) → variable d'env VIGIFEU_SENTINELHUB_INSTANCE, jamais dans
# le dépôt ; write_carte_config l'écrit dans carte-config.js. Sans instance → pas d'imagerie
# (dégradé). Auth par ID d'instance seul (vérifié : WMS GetMap 200 sans OAuth) → pas de proxy.
sentinelhub_wms = "https://sh.dataspace.copernicus.eu/ogc/wms"
sentinelhub_wfs = "https://sh.dataspace.copernicus.eu/ogc/wfs"   # liste les passages S2 + % nuages (auth ID)
sentinelhub_typename = "DSS2"                                # source Sentinel-2 L2A dans le WFS
sentinelhub_layer = "SWIR"                                  # nom de la couche dans l'instance CDSE
sentinelhub_source = "Copernicus Sentinel-2 — fausse-couleur SWIR"   # attribution + légende
# Politique d'affichage (décision 2026-08-01) : n'afficher l'imagerie QUE s'il existe un passage
# Sentinel-2 CLAIR (< max_cloud_pct de nuages) DEPUIS le début du feu, avec sa VRAIE date. Sinon
# dégradé honnête (« pas encore de vue claire depuis le début du feu »). ⚠️ pour un feu ACTIF il
# n'y a souvent pas encore de vue claire post-feu (nuages + repassage ~5 j) → imagerie surtout utile
# sur les feux ARCHIVÉS. La date réelle est résolue via le WFS (carte.js), jamais devinée.
# Fenêtre interrogée = [première détection, dernière + after]. Le WMS est ensuite épinglé à la date exacte.
sentinelhub_after_days = 30   # marge après la dernière détection (chances d'un passage clair post-feu)
sentinelhub_max_cloud_pct = 20   # seuil « clair » (%), filtré sur le WFS côté client

[bulletins]
# Spec 09 — bulletin de veille presse quotidien par feu actif, via l'API news.co-innovate.eu
# (scraping presse + consolidation IA ; le champ `resume` = corps du bulletin). Lignée `declaree`,
# distincte du satellite (P0). `activated` reste OFF tant que l'API n'est pas validée depuis le VPS :
# le job tourne à blanc. L'appel est BACKEND uniquement (pas d'auth, pas de CORS côté API).
activated = false
base_url = "https://news.co-innovate.eu"
heure_locale = 15                       # heure Europe/Paris de déclenchement (cron tz=Europe/Paris)
timezone = "Europe/Paris"               # fuseau du job ET de date_jour envoyée à l'API
nb_articles = 4                         # cible d'articles exploitables
min_sources = 2                         # concordance minimale (garde-fou anti-invention)
fenetre_jours = 1                       # tolérance : jours AVANT date_jour aussi inclus
langue = "fr"
pays = "FR"
mot_cle_prefixe = "incendie"            # repli "feu" côté code (Spec 09 §3/§9)
max_feux_par_jour = 50                  # garde-fou quota ; au-delà = priorité FRP, reste consigné
concurrence = 4                         # fan-out réseau (threads) ; l'écriture DB reste sérielle
timeout_feu_s = 120                     # timeout dur par feu (POST + polling)
timeout_job_s = 600                     # plafond global du job (non bloquant)
poll_intervalle_s = 3                   # cadence d'interrogation GET /recherches/{id}
max_retries = 2
retry_wait_min_s = 5
retry_wait_max_s = 60
provider = "co-innovate"
# Jeu d'indicateurs « incendie de forêt » (recommandé par le guide d'intégration). Grandeurs
# croissantes → agregation="max" (garde la dernière/plus haute estimation, pas de retour à inconnu).
# ⚠️ Spec 09 §10 : comptes, JAMAIS de nom de personne (RGPD). Ajouter un indicateur ne coûte aucun
# appel IA supplémentaire.
indicateurs = [
    { nom = "surface brûlée",                    type = "chiffre", unite = "ha",           agregation = "max" },
    { nom = "nombre de pompiers mobilisés",      type = "chiffre", unite = "pompiers",     agregation = "max" },
    { nom = "avions bombardiers d'eau",          type = "chiffre", unite = "avions",       agregation = "max" },
    { nom = "hélicoptères bombardiers d'eau",    type = "chiffre", unite = "hélicoptères", agregation = "max" },
    { nom = "personnes évacuées",                type = "chiffre", unite = "personnes",    agregation = "max" },
    { nom = "habitations menacées ou détruites", type = "chiffre", unite = "bâtiments",    agregation = "max" },
    { nom = "nombre de blessés",                 type = "chiffre", unite = "personnes",    agregation = "max" },
    { nom = "nombre de morts",                   type = "chiffre", unite = "personnes",    agregation = "max" },
    { nom = "communes concernées",               type = "texte" },
    { nom = "département",                        type = "texte" },
    { nom = "jour de début",                     type = "date" },
    { nom = "heure de début",                    type = "heure" },
    { nom = "origine", type = "options", options = ["accidentelle", "criminelle", "foudre", "inconnue"] },
    { nom = "statut du feu", type = "options", options = ["hors de contrôle", "fixé", "maîtrisé", "éteint"] },
]

[indicateurs]
# Seuils de sévérité du bandeau d'indicateurs de la fiche feu (couleur = état, factuel).
# Croissants : faible < s0 ≤ modéré < s1 ≤ élevé < s2 ≤ très élevé.
vent_seuils = [20, 40, 60]        # km/h
temp_seuils = [25, 30, 35]        # °C
humidite_seuils = [55, 40, 25]    # % (DÉCROISSANT : sec = danger) — humide >55 … très sec <25
frp_seuils = [50, 500]            # MW : modéré <50 ≤ soutenu <500 ≤ intense (jamais « faible » sur un feu)
# Fond de carte : MapTiler raster free-tier pour la bêta (repli béni plan §3), PMTiles
# France auto-hébergé avant le lancement public (Lot 5). La clé est un secret d'env
# (VIGIFEU_MAPTILER_KEY), jamais dans ce fichier.
carte_style = "maptiler-raster"
# (le fond MapTiler est réglé par [generate].maptiler_map — seul lu par le générateur.)

[analytics]
# Mesure d'audience sans cookie (RGPD, cadrage §15) — Umami auto-hébergé. Le website-id
# n'est pas un secret (il apparaît dans le HTML de chaque page). Vide = pas de script.
umami_src = "https://umami.actimeo.fr/script.js"
umami_website_id = "aa8dc8b7-690c-49b9-8053-9fb7d7759c1d"

[legal]
# Mentions légales (affichées sur /mentions-legales/). Jamais en dur dans le gabarit.
editeur = "Sébastien Kicin"
editeur_adresse = "Matthias Claudius Weg 1, 69181 Leimen, Allemagne"
editeur_email = "contact@sentifeu.fr"
directeur_publication = "Sébastien Kicin"
hebergeur = "Hetzner Online GmbH"
hebergeur_adresse = "Industriestr. 25, 91710 Gunzenhausen, Allemagne"
hebergeur_url = "https://www.hetzner.com"

[lexique]
# Barèmes de traduction versionnés (Spec 03 §2.5 / Spec 01 §3.5) — traduisent une
# valeur brute d'indice en classe verbale, le chiffre restant en second niveau (P1).
# Le lexique fr.py n'assemble que des formulations contractuelles ; SEULS les seuils
# numériques (tunables) vivent ici, jamais les libellés (contractuels, dans le code).
# DC (sécheresse profonde) — 4 classes : < faible / modérée / élevée / > très élevée.
# VALEURS DE DÉPART à confronter à la littérature et aux pratiques Météo-France avant
# première publication (Spec 03 §7.1, tâche documentaire du Lot 4).
dc_seuils = [100, 300, 500]
# FWI — 6 classes de danger EFFIS (breakpoints officiels Copernicus/EFFIS) :
# très faible / faible / modéré / élevé / très élevé / extrême.
fwi_seuils = [5.2, 11.2, 21.3, 38.0, 50.0]
# SIM (humidité des sols) — percentile vs normale saisonnière, 4 classes :
# très inférieure / inférieure / proche / supérieure à la normale de saison.
sim_percentile_seuils = [10, 40, 60]

[monitoring]
# Spec 02 §9 — le silence d'une source est une information critique en saison.
# Mécanisme principal : dead-man switch healthchecks.io (un ping manquant EST
# l'alerte). Les URLs de ping sont des secrets → environnement, pas ce fichier :
#   HEALTHCHECK_FIRMS_URL, HEALTHCHECK_BACKFILL_URL,
#   HEALTHCHECK_ARCHIVE_URL, HEALTHCHECK_COLLECTION_URL
gap_alert_hours = 24     # trou de collecte réussie au-delà → alerte (log + ping /fail)

[archive]
# Spec 01 §6 — SQLite = état vivant (fenêtre glissante), Parquet = archive intégrale.
# La purge ne retire de SQLite que ce qui est DÉJÀ exporté, jamais un hotspot
# rattaché à un feu non archivé (un méga-feu peut vivre plus de 14 jours).
dir = "data/archive"                  # racine des partitions Parquet (annee/mois/jour)
hotspot_retention_days = 14           # fenêtre glissante hotspot_raw
ingestion_run_retention_days = 90     # rétention du journal d'ingestion

[weather]
# Open-Meteo (gratuit en phase R&D ; licence non-commerciale — bascule Météo-France
# à trancher au lancement, cadrage §5.8). Le provider est un champ de weather_obs :
# le changement de source est transparent pour le modèle.
provider = "open-meteo"
base_url = "https://api.open-meteo.com/v1/forecast"
forecast_days = 2        # échéances de prévision récupérées (Spec 01 §3.4)
timezone = "GMT"         # réponses en UTC (P7)
timeout_s = 30
max_retries = 3
retry_wait_min_s = 5
retry_wait_max_s = 60

[firms]
# https://firms.modaps.eosdis.nasa.gov/api/area/
base_url = "https://firms.modaps.eosdis.nasa.gov/api/area/csv"
timeout_s = 180          # Spec 02 §9 : timeouts généreux, FIRMS ralentit les jours de grands feux
max_retries = 3
retry_wait_min_s = 30    # backoff exponentiel entre 30 s et 5 min
retry_wait_max_s = 300
fetch_interval_min = 15  # Spec 02 §2 : fraîcheur + mesure de latence NRT
# Budget de transactions (quota MAP_KEY ~5000/10 min, les requêtes area comptent multiple).
# À 15 min d'intervalle, 3 satellites × 2 jours = 6 requêtes/cycle : très en dessous du quota.
day_range = 1            # une requête = un jour (Spec 02 §9 : requêtes jour par jour)
check_previous_day = true  # contrôle J-1 à chaque cycle (hotspots publiés tardivement)
backfill_days = 7        # Spec 02 §2 : fetch_firms_backfill re-demande les jours à trous jusqu'à J-7

# Sources satellitaires : configurables, jamais codées en dur (cadrage §5.1).
# Le champ `code` est l'identifiant d'API FIRMS.
[[firms.sources]]
code = "VIIRS_SNPP_NRT"
platform = "Suomi-NPP"
instrument = "VIIRS"
resolution_m = 375
active = true
notes = "Durée de vie nominale dépassée, orbite en dérive — surveiller."

[[firms.sources]]
code = "VIIRS_NOAA20_NRT"
platform = "NOAA-20"
instrument = "VIIRS"
resolution_m = 375
active = true

[[firms.sources]]
code = "VIIRS_NOAA21_NRT"
platform = "NOAA-21"
instrument = "VIIRS"
resolution_m = 375
active = true
