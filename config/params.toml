# Vigifeu — configuration versionnée (plan de dev §1.1, Spec 02 P4)
# Tout paramètre qui décide quelque chose vit ici, jamais en dur dans le code.
# Le hash de ce fichier entrera dans qualification_reason (Lot 2).

[general]
db_path = "data/vigifeu.db"
# Zone d'interrogation FIRMS : France métropolitaine + marge (ouest,sud,est,nord)
firms_bbox = "-5.5,41.0,10.0,51.5"

[overpass]
# Spec 02 §3 (étape 2) : un passage regroupe les hotspots d'un même satellite
# dont les acquisitions tombent dans une même fenêtre. Un passage VIIRS au-dessus
# de la France dure ~2-3 min (granules adjacents) ; les passages sont espacés de
# ~100 min (période orbitale). 30 min regroupe un passage sans jamais fusionner
# deux passages successifs.
window_min = 30

[monitoring]
# Spec 02 §9 — le silence d'une source est une information critique en saison.
# Mécanisme principal : dead-man switch healthchecks.io (un ping manquant EST
# l'alerte). Les URLs de ping sont des secrets → environnement, pas ce fichier :
#   HEALTHCHECK_FIRMS_URL, HEALTHCHECK_BACKFILL_URL,
#   HEALTHCHECK_ARCHIVE_URL, HEALTHCHECK_COLLECTION_URL
gap_alert_hours = 24     # trou de collecte réussie au-delà → alerte (log + ping /fail)

[archive]
# Spec 01 §6 — SQLite = état vivant (fenêtre glissante), Parquet = archive intégrale.
# La purge ne retire de SQLite que ce qui est DÉJÀ exporté, jamais un hotspot
# rattaché à un feu non archivé (un méga-feu peut vivre plus de 14 jours).
dir = "data/archive"                  # racine des partitions Parquet (annee/mois/jour)
hotspot_retention_days = 14           # fenêtre glissante hotspot_raw
ingestion_run_retention_days = 90     # rétention du journal d'ingestion

[weather]
# Open-Meteo (gratuit en phase R&D ; licence non-commerciale — bascule Météo-France
# à trancher au lancement, cadrage §5.8). Le provider est un champ de weather_obs :
# le changement de source est transparent pour le modèle.
provider = "open-meteo"
base_url = "https://api.open-meteo.com/v1/forecast"
forecast_days = 2        # échéances de prévision récupérées (Spec 01 §3.4)
timezone = "GMT"         # réponses en UTC (P7)
timeout_s = 30
max_retries = 3
retry_wait_min_s = 5
retry_wait_max_s = 60

[firms]
# https://firms.modaps.eosdis.nasa.gov/api/area/
base_url = "https://firms.modaps.eosdis.nasa.gov/api/area/csv"
timeout_s = 180          # Spec 02 §9 : timeouts généreux, FIRMS ralentit les jours de grands feux
max_retries = 3
retry_wait_min_s = 30    # backoff exponentiel entre 30 s et 5 min
retry_wait_max_s = 300
fetch_interval_min = 15  # Spec 02 §2 : fraîcheur + mesure de latence NRT
# Budget de transactions (quota MAP_KEY ~5000/10 min, les requêtes area comptent multiple).
# À 15 min d'intervalle, 3 satellites × 2 jours = 6 requêtes/cycle : très en dessous du quota.
day_range = 1            # une requête = un jour (Spec 02 §9 : requêtes jour par jour)
check_previous_day = true  # contrôle J-1 à chaque cycle (hotspots publiés tardivement)
backfill_days = 7        # Spec 02 §2 : fetch_firms_backfill re-demande les jours à trous jusqu'à J-7

# Sources satellitaires : configurables, jamais codées en dur (cadrage §5.1).
# Le champ `code` est l'identifiant d'API FIRMS.
[[firms.sources]]
code = "VIIRS_SNPP_NRT"
platform = "Suomi-NPP"
instrument = "VIIRS"
resolution_m = 375
active = true
notes = "Durée de vie nominale dépassée, orbite en dérive — surveiller."

[[firms.sources]]
code = "VIIRS_NOAA20_NRT"
platform = "NOAA-20"
instrument = "VIIRS"
resolution_m = 375
active = true

[[firms.sources]]
code = "VIIRS_NOAA21_NRT"
platform = "NOAA-21"
instrument = "VIIRS"
resolution_m = 375
active = true
