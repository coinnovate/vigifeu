# deploy/nginx-sentifeu.conf
# Vhost PUBLIC de Sentifeu (Lot 5, passage public) : sert le site statique
# (/opt/vigifeu/data/site) SANS auth ni noindex, sur sentifeu.fr (+ www).
#
# Diffère de nginx-sentifeu-beta.conf : pas d'auth_basic, pas de X-Robots-Tag noindex,
# server_name = le domaine (plus `_`). Le certbot y ajoute ensuite le bloc 443 (TLS).
#
# Installation :
#   sudo cp /opt/vigifeu/deploy/nginx-sentifeu.conf /etc/nginx/sites-available/sentifeu
#   sudo ln -sf /etc/nginx/sites-available/sentifeu /etc/nginx/sites-enabled/sentifeu
#   sudo rm -f /etc/nginx/sites-enabled/sentifeu-beta      # retire la bêta privée
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sentifeu.fr -d www.sentifeu.fr # ajoute le HTTPS + redirection

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name sentifeu.fr www.sentifeu.fr;

    root /opt/vigifeu/data/site;
    index index.html;

    access_log /var/log/nginx/sentifeu.access.log;
    error_log  /var/log/nginx/sentifeu.error.log;

    # URLs propres : /feux/{id}/ et /communes/{slug}/ sont des dossiers avec index.html.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # Assets versionnés = cache long ; GeoJSON de carte = MIME correct + cache court.
    location /static/ { expires 7d; access_log off; }
    location ~* \.geojson$ { default_type application/geo+json; expires 5m; }

    gzip on;
    gzip_types text/plain text/css application/xml application/atom+xml application/json application/geo+json image/svg+xml;
    gzip_min_length 512;
}
