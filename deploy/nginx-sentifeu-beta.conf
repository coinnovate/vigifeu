# deploy/nginx-sentifeu-beta.conf
# Bêta PRIVÉE de Sentifeu (Lot 5, phase A4) : sert le site statique généré
# (/opt/vigifeu/data/site) derrière une auth HTTP + en-tête noindex.
#
# Installation sur le VPS :
#   1. htpasswd (paquet apache2-utils si absent) — créer l'utilisateur d'auth :
#        sudo htpasswd -c /etc/nginx/.htpasswd-sentifeu <utilisateur>
#   2. Installer le vhost :
#        sudo cp deploy/nginx-sentifeu-beta.conf /etc/nginx/sites-available/sentifeu-beta
#        sudo ln -s /etc/nginx/sites-available/sentifeu-beta /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#   3. TLS (recommandé — l'auth HTTP passe le mot de passe en clair sans HTTPS) :
#        sudo certbot --nginx -d beta.sentifeu.fr
#      certbot injecte lui-même le server{} en 443 ; l'auth et le noindex restent.
#
# Au passage PUBLIC (Lot 5, phase B) : vhost distinct SANS auth_basic ni noindex,
# avec Cloudflare devant. Ce fichier ne sert QUE la bêta.

server {
    listen 80;
    listen [::]:80;
    server_name beta.sentifeu.fr;

    root /opt/vigifeu/data/site;
    index index.html;

    # --- Confidentialité de la bêta -----------------------------------------
    # Auth HTTP sur TOUT le site (vraie confidentialité, pas seulement noindex),
    # héritée par toutes les locations ci-dessous.
    auth_basic           "Sentifeu - beta privee";
    auth_basic_user_file /etc/nginx/.htpasswd-sentifeu;
    # Ceinture-bretelles : rien ne doit être indexé, même si un lien fuite.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # --- Journalisation (alimentera le tableau de bord crawlers DuckDB, phase B) --
    access_log /var/log/nginx/sentifeu-beta.access.log;
    error_log  /var/log/nginx/sentifeu-beta.error.log;

    # --- Routage des URLs propres -------------------------------------------
    # /feux/{id}/ et /communes/{slug}/ sont des dossiers avec index.html.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # --- Cache : assets versionnés = long ; pages/données chaudes = court -----
    # Nginx : un add_header dans une location REMPLACE ceux du server{} — on
    # redéclare donc le noindex partout où on ajoute un en-tête.
    location /static/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires 7d;
        access_log off;
    }
    # GeoJSON de carte : type MIME correct (absent des mime.types par défaut) + court.
    location ~* \.geojson$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        default_type application/geo+json;
        expires 5m;
    }

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/xml application/atom+xml application/json application/geo+json image/svg+xml;
    gzip_min_length 512;
}
