  </g>
  <!-- Wordmark : « Senti » marine + « feu » dégradé -->
  <text x="60" y="40" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#1B2A4A">Senti</tspan><tspan fill="url(#flamme)">feu</tspan>
