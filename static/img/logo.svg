<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 56" role="img" aria-label="Sentifeu">
  <defs>
    <linearGradient id="flamme" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#E01E1E"/>
      <stop offset="1" stop-color="#F7941D"/>
    </linearGradient>
  </defs>
  <!-- Emblème : arc, flamme et pins (forêt sous le feu) -->
  <g>
    <path d="M46 28 A 22 22 0 1 0 24 50" fill="none" stroke="#1B2A4A" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M27 8 C 33 16, 26 20, 30 28 C 32 35, 24 36, 24 43 C 15 39, 15 27, 22 23 C 23 16, 22 13, 27 8 Z" fill="url(#flamme)"/>
    <path d="M8 47 l6 -15 l6 15 Z M17 47 l7 -18 l7 18 Z M28 47 l6 -14 l6 14 Z" fill="#2F7D4F"/>
