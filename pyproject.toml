[project]
name = "vigifeu"
version = "0.1.0"
description = "Vigifeu — veille des incendies de végétation. Socle pré-SaaS."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.5",
    "apscheduler>=3.10,<4",
    "pyarrow>=17.0",   # archive_sweep : export Parquet (tâche planifiée en prod, Lot 1)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vigifeu = "vigifeu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigifeu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
