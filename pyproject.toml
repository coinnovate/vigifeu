[project]
name = "vigifeu"
version = "0.1.0"
description = "Vigifeu — veille des incendies de végétation. Socle pré-SaaS."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.5",
    "apscheduler>=3.10,<4",
    "pyarrow>=17.0",   # archive_sweep : export Parquet (tâche planifiée en prod, Lot 1)
    "shapely>=2.0",    # géométrie du moteur (hull, aire, intersections) — Lot 2, plan §1.1
    "pyproj>=3.6",     # projection Lambert-93 (EPSG:2154) pour distances/aires justes — Lot 2
    "jinja2>=3.1",     # gabarits du générateur statique — Lot 4, plan §1.1 / Spec 04 §2
    "netcdf4>=1.6",    # parsing du netCDF MTG FCI L2 FIR (groupe ListProduct) — Spec 07 §2, phase 2
    "flask>=3.0",      # mini-API same-origin du canal contributif — Spec 10 §2 (service /api/contrib)
    "pillow>=10.3",    # encodage des contributions photo : 2 tailles JPEG, sans EXIF — Spec 10 §4 (étape 2)
    "waitress>=3.0",   # serveur WSGI du service contributif (systemd, derrière reverse proxy) — Spec 10 §2
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vigifeu = "vigifeu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigifeu"]
artifacts = ["src/vigifeu/contrib/*.js"]  # snippets clients servis par /api/contrib/*.js (widget, dépôt)

[tool.pytest.ini_options]
testpaths = ["tests"]
