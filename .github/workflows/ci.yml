# CI — pytest couvre les 5 garde-fous Spec 04 §9 (Lot 4) : lint lexique, golden file
# Saumos, JSON-LD valide, budget perf < 100 ko, aucun horodatage de génération
# (tests/test_garde_fous_ci.py + tests/test_generate_feu.py::test_golden_file_saumos).
name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run pytest -q
